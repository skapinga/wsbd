[project]
name = "wsbd"
version = "0.1.0"
description = "WSBD = Waterspanningen bij Dijken"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "comm>=0.2.3",
    "fipy>=4.0.2",
    "ipykernel>=7.2.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "probabilistic-library>=26.1.1",
    "timflow>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
